<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; media-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decibel</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="screen">
  <header id="header"></header>
  <div id="tray"></div>
  <div id="chips"></div>
  <div id="searchWrap" class="search-bar" hidden>
    <span class="search-icon" id="searchIcon"></span>
    <input id="search" type="text" placeholder="Search your songs" autocomplete="off" spellcheck="false">
    <button id="searchClear" class="plain" hidden aria-label="Clear search"></button>
  </div>
  <main id="view"></main>
  <div id="mini"></div>
  <nav id="tabbar"></nav>
  <div id="sheetRoot"></div>
  <div id="npRoot"></div>
  <div id="toast" class="toast" hidden></div>
  <div id="dropOverlay" hidden><div>Drop songs and pictures to import</div></div>
</div>
<audio id="audio" preload="metadata"></audio>
<script src="icons.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
